<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result - SafeRide AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding: 20px; background: transparent; }
        .result-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .media-display {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
        }
        .back-btn { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="result-container">
        {% if media_type == 'image' %}
            <img src="{{ media_url }}" alt="Analyzed Image" class="media-display">
        {% elif media_type == 'video' %}
            <img src="{{ url_for('video_feed', video_name=video_name) }}" alt="Analyzed Video Stream" class="media-display">
        {% endif %}
    </div>
</body>
</html>
